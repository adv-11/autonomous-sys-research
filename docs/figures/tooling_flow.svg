<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
  <title id="title">Reference toolchain across the GPT and Claude tooling PRs</title>
  <desc id="desc">Native annotations and censored prediction caches pass through explicit adapters into canonical records. A reference evaluator checks deterministic matching and threshold policies, while provenance guards protect held-out declarations. Empirical G0 prerequisites remain pending. No performance results are shown.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#52657d"/></marker></defs>
  <rect width="1120" height="420" rx="12" fill="#f6f8fb"/>
  <text x="24" y="38" font-size="24" font-weight="bold" fill="#162a42">Reference tooling: evidence before experiments</text>
  <text x="24" y="64" font-size="15" fill="#52657d">Two tooling PRs · standard-library core · diagnostic replay does not establish weather-transfer performance</text>
  <g font-size="16" fill="#162a42">
    <rect x="24" y="98" width="240" height="166" rx="8" fill="#e7eef9" stroke="#8ca5c7"/>
    <text x="40" y="126" font-size="18" font-weight="bold">Existing local assets</text>
    <text x="40" y="157">COCO / KITTI annotations</text>
    <text x="40" y="184">Capped, rounded cache rows</text>
    <text x="40" y="211">Native categories + ignores</text>
    <text x="40" y="240" font-size="14">Read-only reuse; log provenance</text>
    <rect x="304" y="98" width="240" height="166" rx="8" fill="#e5f2ee" stroke="#83aea1"/>
    <text x="320" y="126" font-size="18" font-weight="bold">Claude: data adapters</text>
    <text x="320" y="157">Explicit mappings / policies</text>
    <text x="320" y="184">Canonical IDs, boxes, scores</text>
    <text x="320" y="211">Coverage + exclusion records</text>
    <text x="320" y="240" font-size="14">Explicit policy; no silent repair</text>
    <rect x="584" y="98" width="240" height="166" rx="8" fill="#ede9f7" stroke="#a292c2"/>
    <text x="600" y="126" font-size="18" font-weight="bold">GPT: reference evaluator</text>
    <text x="600" y="157">Deterministic IoU matching</text>
    <text x="600" y="184">Observed-score boundaries</text>
    <text x="600" y="211">Recall · FPPI · ceilings · gaps</text>
    <text x="600" y="240" font-size="14">Undefined / infeasible: explicit</text>
    <rect x="864" y="98" width="232" height="166" rx="8" fill="#fbefdc" stroke="#c3a16b"/>
    <text x="880" y="126" font-size="18" font-weight="bold">Provenance guards</text>
    <text x="880" y="157">Complete inference coverage</text>
    <text x="880" y="184">Pipeline consistency</text>
    <text x="880" y="211">Dataset / group / role checks</text>
    <text x="880" y="240" font-size="14">Declared, not authenticated</text>
  </g>
  <g stroke="#52657d" stroke-width="2" marker-end="url(#arrow)"><path d="M266 181 H300"/><path d="M546 181 H580"/><path d="M826 181 H860"/></g>
  <rect x="24" y="298" width="1072" height="96" rx="8" fill="#fff" stroke="#a9b7c7"/>
  <text x="40" y="327" font-size="18" font-weight="bold" fill="#162a42">G0 remains pending: real adverse-condition evidence is the next gate</text>
  <text x="40" y="354" font-size="16" fill="#344b65">BDD/ACDC access + artifact audit · verified groups and split manifests · per-model GPU training/evaluation checks</text>
  <text x="40" y="378" font-size="14" fill="#52657d">Original implementation diagram. Passing tests validates code behavior, not detector accuracy, interval coverage or driving safety.</text>
</svg>
