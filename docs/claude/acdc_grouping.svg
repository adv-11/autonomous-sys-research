<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>ACDC dependency edges and proposed role allocation</title>
  <rect width="820" height="400" fill="#ffffff"/>
  <defs>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2.2" fill="#333"/></marker>
  </defs>

  <!-- Left: edge types -->
  <text x="20" y="26" font-size="14" font-weight="bold" fill="#111">Edges (union-find; components = candidate groups)</text>

  <g>
    <rect x="20" y="44" width="150" height="132" rx="6" fill="#f3f6fb" stroke="#7a8db3"/>
    <text x="30" y="62" font-weight="bold" fill="#223">one fog recording</text>
    <rect x="30" y="72" width="62" height="22" rx="3" fill="#dfe8f7" stroke="#7a8db3"/><text x="36" y="87" font-size="11">GOPR train</text>
    <rect x="100" y="72" width="62" height="22" rx="3" fill="#dfe8f7" stroke="#7a8db3"/><text x="106" y="87" font-size="11">GOPR val</text>
    <rect x="30" y="122" width="62" height="22" rx="3" fill="#dfe8f7" stroke="#7a8db3"/><text x="36" y="137" font-size="11">GP01 val</text>
    <rect x="100" y="122" width="62" height="22" rx="3" fill="#fbf1dc" stroke="#b8933f"/><text x="106" y="137" font-size="11">GP01 _ref</text>
    <line x1="92" y1="83" x2="100" y2="83" stroke="#2f6fd6" stroke-width="3"/>
    <line x1="61" y1="94" x2="61" y2="122" stroke="#7b3fb8" stroke-width="3" stroke-dasharray="6 3"/>
    <line x1="92" y1="133" x2="100" y2="133" stroke="#b8933f" stroke-width="3"/>
    <text x="30" y="166" font-size="10" fill="#555">val straddles the chapter boundary</text>
  </g>

  <g>
    <rect x="200" y="44" width="150" height="132" rx="6" fill="#f3f6fb" stroke="#7a8db3"/>
    <text x="210" y="62" font-weight="bold" fill="#223">fog rec. + snow rec.</text>
    <rect x="210" y="72" width="62" height="22" rx="3" fill="#dfe8f7" stroke="#7a8db3"/><text x="216" y="87" font-size="11">fog test</text>
    <rect x="280" y="72" width="62" height="22" rx="3" fill="#fbf1dc" stroke="#b8933f"/><text x="286" y="87" font-size="11">fog _ref</text>
    <rect x="210" y="122" width="62" height="22" rx="3" fill="#dfe8f7" stroke="#7a8db3"/><text x="216" y="137" font-size="11">snow test</text>
    <rect x="280" y="122" width="62" height="22" rx="3" fill="#fbf1dc" stroke="#b8933f"/><text x="286" y="137" font-size="11">snow _ref</text>
    <line x1="272" y1="83" x2="280" y2="83" stroke="#b8933f" stroke-width="3"/>
    <line x1="272" y1="133" x2="280" y2="133" stroke="#b8933f" stroke-width="3"/>
    <line x1="311" y1="94" x2="311" y2="122" stroke="#c0392b" stroke-width="3"/>
    <text x="210" y="166" font-size="10" fill="#555">same reference PNG bytes</text>
  </g>

  <g font-size="11">
    <line x1="24" y1="200" x2="54" y2="200" stroke="#2f6fd6" stroke-width="3"/><text x="60" y="204"><tspan font-weight="bold">chapter</tspan>: same condition + token (filename)</text>
    <line x1="24" y1="220" x2="54" y2="220" stroke="#7b3fb8" stroke-width="3" stroke-dasharray="6 3"/><text x="60" y="224"><tspan font-weight="bold">recording</tspan>: same GoPro number (inferred)</text>
    <line x1="24" y1="240" x2="54" y2="240" stroke="#b8933f" stroke-width="3"/><text x="60" y="244"><tspan font-weight="bold">pair</tspan>: adverse/_ref stem (README; 4006)</text>
    <line x1="24" y1="260" x2="54" y2="260" stroke="#c0392b" stroke-width="3"/><text x="60" y="264"><tspan font-weight="bold">identical bytes</tspan>: equal SHA-256 (12; 2 cross-cond.)</text>
    <text x="24" y="290" fill="#555">Not blocked (unknown): same route or day across</text>
    <text x="24" y="306" fill="#555">recordings, shared normal drives without identical</text>
    <text x="24" y="322" fill="#555">bytes, consecutive-number sessions.</text>
  </g>

  <!-- Right: roles -->
  <text x="470" y="26" font-size="14" font-weight="bold" fill="#111">Proposed roles (whole components)</text>
  <text x="470" y="44" font-size="11" fill="#555">labelled adverse images / components per condition</text>
  <g font-size="11">
    <text x="470" y="70" font-weight="bold">role</text>
    <text x="590" y="70" font-weight="bold">fog</text><text x="640" y="70" font-weight="bold">night</text>
    <text x="695" y="70" font-weight="bold">rain</text><text x="750" y="70" font-weight="bold">snow</text>
    <rect x="466" y="78" width="334" height="24" fill="#e7f1e4"/>
    <text x="470" y="94">calibrator_fit</text><text x="590" y="94">233/2</text><text x="640" y="94">104/1</text><text x="695" y="94">8/1</text><text x="750" y="94">70/1</text>
    <rect x="466" y="104" width="334" height="24" fill="#e4edf7"/>
    <text x="470" y="120">threshold_selection</text><text x="590" y="120">193/2</text><text x="640" y="120">50/1</text><text x="695" y="120">13/1</text><text x="750" y="120">140/1</text>
    <rect x="466" y="130" width="334" height="24" fill="#f7e6e4"/>
    <text x="470" y="146">held_out</text><text x="590" y="146">7/1</text><text x="640" y="146">203/1</text><text x="695" y="146">479/2</text><text x="750" y="146">57/2</text>
    <rect x="466" y="156" width="334" height="24" fill="#eeeeee"/>
    <text x="470" y="172">descriptive_only</text><text x="590" y="172">67/1</text><text x="640" y="172">149/1</text><text x="695" y="172">0/0</text><text x="750" y="172">233/2</text>
    <text x="470" y="200" fill="#555">+ 6 unlabelled_only components (test-only recordings)</text>
  </g>
  <rect x="466" y="220" width="334" height="88" rx="6" fill="#fff4f2" stroke="#c0392b"/>
  <text x="478" y="242" font-size="13" font-weight="bold" fill="#a12a1e">Verdict: insufficient for confirmatory ~5 pp</text>
  <text x="478" y="262" font-size="11">1–2 held-out components per condition (design decision).</text>
  <text x="478" y="280" font-size="11">Recommend: source-only descriptive ACDC panel;</text>
  <text x="478" y="298" font-size="11">adaptation only as exploratory grouped cross-fitting.</text>

  <text x="20" y="350" font-size="10" fill="#555">Counts measured from the official ACDC detection JSON and RGB tree (2026-11-06); layout is conceptual.</text>
  <text x="20" y="364" font-size="10" fill="#555">No recording identifiers are published. Proposal only; Advait's approval pending; G0 pending.</text>
  <text x="20" y="378" font-size="10" fill="#555">Claude, completing a GPT draft (incomplete; Codex credits exhausted). Not GPT-reviewed.</text>
</svg>
