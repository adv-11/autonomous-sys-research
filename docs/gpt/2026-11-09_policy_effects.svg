<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410" role="img" aria-labelledby="title desc">
  <title id="title">Two paths from candidate policy to operating recall</title>
  <desc id="desc">Conceptual design, not results. Source candidate changes may move the selected threshold. Target candidate changes may alter the evaluated pool. A certificate at a fixed threshold protects only that operating subset.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#45576b"/></marker></defs>
  <rect width="920" height="410" fill="#f5f7fb"/>
  <g font-family="Arial, sans-serif" fill="#172b43">
    <text x="32" y="37" font-size="23" font-weight="bold">Candidate policy has two routes to operating recall</text>
    <text x="32" y="62" font-size="14">GPT conceptual design / fixed detector, matching and population / no measured results</text>
    <g stroke="#c3cfdf" stroke-width="1.5">
      <rect x="32" y="111" width="200" height="130" rx="10" fill="#e5edfa"/>
      <rect x="300" y="95" width="250" height="83" rx="10" fill="#fff0d8"/>
      <rect x="300" y="203" width="250" height="83" rx="10" fill="#e0f1eb"/>
      <rect x="625" y="135" width="260" height="112" rx="10" fill="#fff"/>
    </g>
    <g font-size="17" font-weight="bold">
      <text x="51" y="148">Change floor or cap</text>
      <text x="320" y="125">Source selection pool</text>
      <text x="320" y="233">Target candidate pool</text>
      <text x="647" y="169">Operating recall / FPPI</text>
    </g>
    <g font-size="14">
      <text x="51" y="176">Named finite pool;</text><text x="51" y="198">native replay required</text>
      <text x="320" y="152">May move selected threshold</text>
      <text x="320" y="260">May remove relevant detections</text>
      <text x="647" y="198">Separate threshold movement</text><text x="647" y="220">from direct target effects</text>
    </g>
    <g fill="none" stroke="#45576b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M232 150L300 136"/><path d="M232 205L300 244"/>
      <path d="M550 136L625 164"/><path d="M550 244L625 220"/>
    </g>
    <text x="32" y="329" font-size="16" font-weight="bold">Predeclared null</text>
    <text x="32" y="353" font-size="15">At a certified fixed threshold: same detections; ceiling and removable-miss changes cancel.</text>
    <text x="32" y="379" font-size="15">Target completeness alone does not protect against a threshold moved by source truncation.</text>
  </g>
</svg>
