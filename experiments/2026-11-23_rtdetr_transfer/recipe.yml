# GPT Sol: official RT-DETRv2 R18 architecture/criterion/augmentations.
__include__: ['/content/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/rtdetrv2_r18vd_120e_coco.yml']
num_classes: 10
remap_mscoco_category: False
device: cuda
seed: 0
PResNet:
  pretrained: False
train_dataloader:
  total_batch_size: 16
  num_workers: 4
  drop_last: False
  dataset:
    img_folder: /content/data/images/train
    ann_file: /content/data/source.json
    transforms:
      policy:
        epoch: 47
  collate_fn:
    scales: null
val_dataloader:
  total_batch_size: 16
  num_workers: 4
  dataset:
    img_folder: /content/data/images/train
    ann_file: /content/data/source.json
# No val_dataloader/evaluator is instantiated by this experiment's training loop.
optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*(?:norm|bn)).*$', weight_decay: 0.0}
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
lr_scheduler:
  type: MultiStepLR
  milestones: [1000]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 2000
use_amp: True
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9999
  warmups: 2000
clip_max_norm: 0.1
print_freq: 100
